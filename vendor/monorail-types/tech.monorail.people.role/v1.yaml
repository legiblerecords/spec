type: tech.monorail.people.role
version: 1
title: role
description: A responsibility in an organization, such as security lead or data protection officer, and who holds it now. Policies and controls name the role that owns them.
fields:
  id: slug -- Such as security-lead, for references like role:security-lead.
  name: string -- Security lead, Data protection officer.
  description?: string
  holders?: ref(person)[] @user.unique_id -- When the people travel in the same bundle.
  holder_matches?: personMatch[] @user.name @user.contact.email.work @user.unique_id -- Otherwise. Each needs emails or identifiers.
  source_fields?: object -- The source's own fields that no field here covers, under the source's names. Readers keep it and don't interpret it. Never a personal value that a field here would label.
  produced_by?: produced_by
  source?: source
examples:
  - $type: tech.monorail.people.role
    version: 1
    id: security-lead
    name: Security lead
    holders: [person:ana-lima]

type: tech.monorail.controls.statement
version: 1
title: statement
description: A passage of a policy, with what kind of statement it is and, for a commitment, the controls that make it true. A commitment with neither controls nor no_control is a gap, and a reader shows it as one.
fields:
  id: slug
  kind: known(commitment, guidance, context)
  policy: ref(policy) -- The policy it is a passage of, which travels with it.
  text: string -- The passage as it appears in the policy's revision.
  controls: ref(control)[] -- Empty for guidance and context, and for a commitment only with no_control.
  basis?: known(stated, implied)
  no_control?:
    description: Why a commitment has no control, and who accepted that.
    fields:
      reason: string
      accepted_by: string -- By name.
      accepted_at: date
  scope?: string -- Narrower than the policy's, by name.
  audience?: string -- Narrower than the policy's, by name.
  note?: string
  source_fields?: object -- The source's own fields that no field here covers, under the source's names. Readers keep it and don't interpret it. Never a personal value that a field here would label.
  produced_by?: produced_by
  source?: source
examples:
  - $type: tech.monorail.controls.statement
    version: 1
    id: access-control-sso
    kind: commitment
    policy: policy:access-control
    text: Everyone signs in with SSO and a passkey.
    controls: [control:mfa]

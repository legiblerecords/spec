type: tech.monorail.vulnerabilities.alert
version: 1
title: vulnerability-alert
description: A scanner's alert about a vulnerability in a repository, a VM or a container image, such as from Aikido, Dependabot, Socket or Snyk, and its status there. Large scans travel as a record set.
fields:
  id: slug -- <scanner>-<the scanner's alert id>, such as dependabot-412.
  scanner: /^[a-z0-9][a-z0-9.:-]*$/ -- The scanner, in lowercase, such as aikido, dependabot, socket or snyk. (Not source, which is where every record says what it was built from.)
  target:
    description: What the vulnerability is in.
    fields:
      kind: known(repository, vm, container-image)
      id: identifier -- For a reader to match exactly against what it holds, such as system github and id acme/api, or system aikido and id 70001 for a VM. For a container image, the image repository without a tag or digest, such as ghcr.io/acme/api, so each build is the same target; seen_in says which build.
      name?: string -- How to show it, such as a VM's hostname.
      seen_in?:
        description: The latest version of the target the scanner found it in, so a reader can skip a finding whose version is no longer running. At least one field.
        fields:
          digest?: /^sha256:[0-9a-f]{64}$/ -- A container image's digest, in the registry's own form.
          tag?: string -- A container image's tag, such as 1.4.2. Tags move; a digest is exact.
          commit?: /^[0-9a-f]{7,64}$/ -- A repository's commit.
  package?: string
  ecosystem?: string -- Such as npm, cargo or pypi.
  advisory?: string -- The canonical advisory id, GHSA-… or CVE-….
  severity: known(critical, high, medium, low, info)
  cvss?: number(0..10)
  affected_file?: string -- The vulnerable file, such as a library's path on a VM.
  installed_version?: string
  fixed_versions?: string[] -- The versions that fix it.
  cwes?: /^CWE-[0-9]+$/[] -- Such as CWE-787.
  status: known(open, fixed, dismissed, auto-dismissed)
  dismissed_reason?: string
  first_seen: datetime
  fixed_at?: datetime
  url?: string -- The alert in the scanner's own interface.
  source_fields?: object -- The source's own fields that no field here covers, under the source's names. Readers keep it and don't interpret it. Never a personal value that a field here would label.
  produced_by?: produced_by
  source?: source
examples:
  - $type: tech.monorail.vulnerabilities.alert
    version: 1
    id: dependabot-412
    scanner: dependabot
    target: { kind: repository, id: { system: github, id: acme/api } }
    package: lodash
    ecosystem: npm
    advisory: GHSA-qqqq-wwww-mmmm
    severity: high
    cvss: 7.2
    status: open
    first_seen: 2026-11-02T08:00:00Z

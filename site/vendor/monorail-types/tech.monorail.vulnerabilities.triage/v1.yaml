type: tech.monorail.vulnerabilities.triage
version: 1
title: vulnerability-triage
description: A decision that vulnerability alerts need no fix - not applicable, or a false positive - for the alerts it names or matches, kept apart from the scanner's own status so it survives each import. While active it sets aside every alert it covers, so they have no deadline. It covers an alert only while the alert matches it; when the alert changes, such as becoming reachable, it no longer does and the finding is new. Revoking it restarts nothing - the alerts it set aside count from their first_seen again, or from an earlier exit from a decision's cover if they have one, and one that needs more time gets an exception with kind extension. Readers keep revoked decisions, because an SLA's clock asks what was in force on past days. Accepting a risk is an exception, not a triage decision. It names what it covers (subjects, subject_refs or match, at least one) and when it was decided (at or on, exactly one).
fields:
  id: slug -- Such as tri-2026-031, for references like vulnerability-triage:tri-2026-031.
  decision: known(not-applicable, false-positive)
  status: known(active, revoked) -- revoked is no longer applied, for whatever reason. A changed alert needs no revocation, because it simply stops matching.
  reason: string -- Why, in Markdown, such as Unreachable per Socket, or Dev dependency, not shipped.
  subjects?: ref(vulnerability-alert)[] -- What it covers, when they travel in the same bundle. A list names alerts whatever their reachability; to rely on reachability, use match.
  subject_refs?: externalRef[] -- What it covers, when they travel elsewhere.
  match?:
    description: What it covers as a rule over vulnerability alerts, applied to each alert as it is now, so it covers alerts that appear later. Every field given must match; within a field, any one value matches. A field left out matches anything; a field the alert has no value for doesn't match, except reachability, which counts as unknown. At least one field, and no empty lists.
    fields:
      advisory?: string[] -- Advisory ids, GHSA-… or CVE-…, compared case-insensitively against the alert's advisory and advisory_aliases.
      package?: string[] -- Package names, compared exactly.
      ecosystem?: string[] -- Compared case-insensitively.
      target_kind?: known(repository, vm, container-image)[]
      targets?: identifier[] -- Exact targets, compared as identifiers are, system and id.
      reachability?: known(reachable, unreachable, unknown)[] -- The facts it relies on.
  decided_by?: string @user.name
  at?: datetime -- When it was decided. Exactly one of at and on.
  on?: date -- The day it was decided, when the source records only the day.
  review_by?: date -- When someone should look again. It still applies after this date.
  revoked_on?: date -- When it was revoked; only when status is revoked, and then required.
  replaces?: ref(vulnerability-triage) -- The decision this one amends.
  body?: string -- Notes, in Markdown.
  source_fields?: object -- The source's own fields that no field here covers, under the source's names. Readers keep it and don't interpret it. Never a personal value that a field here would label.
  produced_by?: produced_by
  source?: source
examples:
  - $type: tech.monorail.vulnerabilities.triage
    version: 1
    id: tri-2026-031
    decision: not-applicable
    status: active
    reason: Unreachable per scanner analysis.
    match: { advisory: [CVE-2099-00003], targets: [{ system: github, id: acme/api }], reachability: [unreachable] }
    decided_by: Ana Lima
    on: 2026-11-05
    review_by: 2027-05-01

type: tech.monorail.people.person
version: 1
title: person
description: A person in an organization - an employee, contractor or service identity - as an HR tool or identity provider knows them. Other records point at a person with ref(person) when it travels in the same bundle, or describe them with a personMatch when it doesn't.
fields:
  id: slug -- The publisher's key for this person, such as ana-lima, for references like person:ana-lima.
  name: string @user.name
  emails?: email[] @user.contact.email.work -- Work addresses; the first is primary.
  status: known(active, suspended, terminated)
  kind?: known(employee, contractor, service-account)
  title?: string @user.job_title
  team?: string @user.workplace -- The publisher's own label, for display.
  manager?: ref(person) @user.unique_id -- When the manager travels in the same bundle.
  manager_match?: personMatch @user.name @user.contact.email.work @user.unique_id -- Otherwise. Needs emails or identifiers.
  start_date?: date @user.workplace
  end_date?: date @user.workplace
  identifiers?: identifier[] @user.unique_id -- This person's ids in other systems, so others' personMatch finds them.
  source_fields?: object -- The source's own fields that no field here covers, under the source's names. Readers keep it and don't interpret it. Never a personal value that a field here would label.
  produced_by?: produced_by
  source?: source
examples:
  - $type: tech.monorail.people.person
    version: 1
    id: ana-lima
    name: Ana Lima
    emails: [ana@acme.example]
    status: active
    kind: employee
    title: Platform engineer
    team: Platform
    manager: person:bo-silva
    start_date: 2024-03-04
    identifiers:
      - { system: okta, id: 00u1ab2cd3 }

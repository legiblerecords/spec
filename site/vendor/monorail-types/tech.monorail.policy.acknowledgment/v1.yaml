type: tech.monorail.policy.acknowledgment
version: 1
title: policy-acknowledgment
description: A person's acknowledgment of one revision of a policy. It has person or person_match, or both; a reader shows one with neither, or whose match finds no one or several people, as unresolved.
fields:
  id: slug
  policy:
    description: The policy, a tech.monorail.policy.document, with revision and sha256 (its content hash) pinning the exact text acknowledged.
    type: externalRef
    json:
      required: [type, key, revision, sha256]
  person?: ref(person) @user.unique_id -- When the person travels in the same bundle.
  person_match?: personMatch @user.name @user.contact.email.work @user.unique_id -- Who acknowledged, for a reader to match. Needs emails or identifiers.
  at: datetime
  method?: known(passkey, sso, email-link, attested) -- How the person signed in to acknowledge.
  statement?: string -- The words they agreed to, when not just "I have read and agree".
  signature?:
    description: The acknowledging system's own signature over this record, beside any bundle signature. Ed25519 over "tech.monorail.policy.acknowledgment v1" and a newline, then the record's content line without the signature field - its canonical line without produced_by, source and the final newline (records.md § Content lines) - by the key named here in that publisher's key set. Republishing the record with new provenance keeps it valid. A key retired before the acknowledgment's at doesn't count. A signature is evidence only when its publisher is one the reader already trusts to attest acknowledgments, normally the policy's publisher or the bundle's signer; any other is shown as unverified, as is one that fails to verify or has an alg other than ed25519. A failed signature never makes a bundle bad_bundle.
    fields:
      alg: known(ed25519)
      publisher: domain -- Whose key set holds the key.
      key: string -- The key's id in that key set.
      value: /^[A-Za-z0-9_-]{85}[AQgw]$/ -- The 64-byte signature, in canonical base64url without padding.
  source_fields?: object -- The source's own fields that no field here covers, under the source's names. Readers keep it and don't interpret it. Never a personal value that a field here would label.
  produced_by?: produced_by
  source?: source
examples:
  - $type: tech.monorail.policy.acknowledgment
    version: 1
    id: access-control-3-ana-lima
    policy: { type: tech.monorail.policy.document, key: access-control, publisher: acme.example, revision: 3, sha256: 72fe47cebf17538e380bdddbdb7298ef71607b319ce53ff51c3386d2c346cfa5 }
    person_match: { emails: [ana@acme.example] }
    at: 2026-11-21T14:03:12Z
    method: passkey

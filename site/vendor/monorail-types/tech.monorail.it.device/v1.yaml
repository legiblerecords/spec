type: tech.monorail.it.device
version: 1
title: device
description: A computer or phone as a device manager (MDM) knows it - its platform, who uses it, and the state of its security checks. Large fleets travel as a record set.
fields:
  id: slug -- The publisher's key, such as the serial lowercased.
  name: string @user.name -- The device's name, often its user's.
  platform: known(macos, windows, linux, ios, android, chromeos, other)
  os_version?: string
  serial?: string @user.device.device_id
  person?: ref(person) @user.unique_id -- Who uses it, when they travel in the same bundle.
  person_match?: personMatch @user.name @user.contact.email.work @user.unique_id -- Who uses it, for a reader to match. Needs emails or identifiers. A device with no user has neither person nor person_match.
  managed_by?: string -- The device manager, such as iru, intune, jamf or kandji.
  checks?:
    description: The device manager's security checks, as last reported.
    fields:
      disk_encryption?: known(on, off, unknown)
      firewall?: known(on, off, unknown)
      screen_lock?: known(on, off, unknown)
      os_supported?: boolean -- Whether its OS version still gets security updates.
  last_seen?: datetime -- When the device manager last heard from it.
  source_fields?: object -- The source's own fields that no field here covers, under the source's names, such as Iru's blueprint. Readers keep it and don't interpret it. Never a personal value that a field here would label.
  produced_by?: produced_by
  source?: source
examples:
  - $type: tech.monorail.it.device
    version: 1
    id: c02xk1abcd
    name: Ana's MacBook Pro
    platform: macos
    os_version: 15.1.1
    serial: C02XK1ABCD
    person_match: { emails: [ana@acme.example] }
    managed_by: iru
    checks: { disk_encryption: on, firewall: on, screen_lock: on, os_supported: true }
    last_seen: 2026-11-23T18:20:00Z

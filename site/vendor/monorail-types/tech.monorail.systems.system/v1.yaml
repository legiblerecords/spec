type: tech.monorail.systems.system
version: 1
title: system
description: A system an organization runs or uses, such as a service, a data store, a cloud account or a SaaS tool - what it is for, how people sign in to it, and what data it holds. One record per system; where the data differs, as between a production and a staging database, one each. Large inventories travel as a record set.
fields:
  id: slug -- The publisher's key, such as billing-db-prod, for references like system:billing-db-prod.
  name: string
  kind: known(service, data-store, cloud-account, saas, identity, network, endpoint-tool, other)
  status: known(active, retired)
  purpose?: string -- What the organization uses it for, in a sentence.
  description?: string
  owner?: string @user.name -- The one accountable person or role, by name.
  owner_match?: personMatch @user.name @user.contact.email.work @user.unique_id -- The owning person, for a reader to match. Needs emails or identifiers.
  owner_role?: ref(role) -- The owning role, when it travels in the same bundle.
  owner_role_ref?: externalRef -- The owning role, when it travels elsewhere.
  identifiers?: identifier[] -- The system's ids elsewhere, such as system okta and its app id there, or system aws and an account id.
  vendor?: string -- Who provides it, by name. Absent for what the organization builds.
  production?: boolean -- Whether it is, or runs in, production.
  availability?: known(critical, standard) -- critical when an outage stops the product or revenue.
  exposure?: known(internet-facing, authenticated, internal, offline) @company.security.architecture -- Who can reach it at all. auth says how they then sign in.
  auth?:
    description: How people and other systems sign in to it.
    fields:
      methods?: known(sso, password, passkey, api-key, certificate, ssh-key, none)[] @company.security.architecture -- Every way in that is allowed, not only the usual one.
      idp?: /^[a-z0-9][a-z0-9.:-]*$/ @company.security.architecture -- The identity provider behind sso, in lowercase, such as okta, entra or google.
      sso_enforced?: boolean @company.security.architecture -- There is no way in but sso.
      mfa?: known(required, optional, off, unknown) @company.security.architecture
      provisioning?: known(scim, sso-jit, manual) @company.security.architecture -- How accounts are created and removed.
  data_categories?: /^[a-z0-9_]+(\.[a-z0-9_]+)*$/[] -- Every category of the organization's own data it stores, processes or transmits, including backups and copies, as category keys from Monorail's data taxonomy (tech.monorail.data, version 1, at https://monorail.tech/taxonomies/tech.monorail.data/v1.json), such as user.contact.email. The most specific key that is true. What it holds on behalf of customers goes in customer_content.
  customer_content?: /^[a-z0-9_]+(\.[a-z0-9_]+)*$/[] -- Categories of data it holds on behalf of customers, such as what they upload or enter into the product, as category keys from the same taxonomy. Data about customers that the organization collects for itself, such as CRM contacts, goes in data_categories.
  customer_content_unknown?: boolean -- It holds customer content whose categories can't be known.
  data_subjects?: /^[a-z0-9_]+$/[] -- Whose data it holds, as subject keys from the same taxonomy, such as employee or customer_user.
  classification?:
    description: The organization's own classification of the system, as stated. A reader shows it as a claim, beside any level it works out from the categories.
    fields:
      label: string -- In the organization's words, such as Confidential or Tier 1.
      level?: known(public, internal, confidential, restricted) -- Which of these the label corresponds to, when the publisher knows.
  level?: known(public, internal, confidential, restricted) -- The highest level of the data it holds, as the publisher computed it from the categories and a data policy. Never typed by hand; a stated level goes in classification.
  source_fields?: object -- The source's own fields that no field here covers, under the source's names. Readers keep it and don't interpret it. Never a personal value that a field here would label.
  produced_by?: produced_by
  source?: source
examples:
  - $type: tech.monorail.systems.system
    version: 1
    id: tickets-db-prod
    name: Tickets database (production)
    kind: data-store
    status: active
    purpose: Stores the support tickets customers' users write in the product.
    owner: Platform lead
    production: true
    exposure: internal
    auth: { methods: [sso, certificate], idp: okta, mfa: required }
    data_categories: [company.security.monitoring]
    customer_content: [user.name, user.contact.email, user.content.messages]
    data_subjects: [customer_user]
    classification: { label: Confidential, level: confidential }

type: org.legiblerecords.bundle
version: 1
title: bundle
description: The manifest of a bundle - every file it holds, with its hash.
fields:
  produced_by?: common.produced_by
  source?: common.source
  published_at?: common.datetime -- When the publisher made this bundle. Required when the bundle is in a feed.
  feed?:
    description: The feed and stream this bundle was published for.
    fields:
      id: common.feedId -- The feed's id, <publisher>/<slug>.
      stream: slug -- The stream within the feed.
  prepared_by?: personMatch -- Who prepared the bundle, for a reader to ask about it. What the bundle says, not proof of who sent it.
  note?: string -- What the bundle is and why it was made, in Markdown.
  record_notes?:
    description: Notes on single records, such as why one changed or was removed.
    items:
      fields:
        type: /^[a-z0-9-]+(\.[a-z0-9-]+)+$/ -- The record's $type.
        key: slug -- The record's id. The record need not be in the bundle, so that a note can explain a removal.
        note: string -- In Markdown.
  complete?:
    description: The types this bundle holds every record of, whatever their version. A record of one of these types that a reader holds and the bundle lacks was removed at the source. A type not listed may be partial.
    items: /^[a-z0-9-]+(\.[a-z0-9-]+)+$/
  based_on?:
    description: The bundle the publisher started from, such as one the reader sent it.
    fields:
      manifest_sha256: sha256 -- Of that bundle's manifest.json, as stored.
      published_at?: datetime -- That bundle's published_at, for people to read.
  files:
    items:
      fields:
        path: string -- Relative to the bundle's root, with / separators.
        sha256: common.sha256
        record_type?: string -- The record's $type, for a record.
        record_version?: integer(1..) -- The record's version, for a record.
        media_type?: string -- For an attachment.
        count?: integer(0..) -- For a record set, how many records it holds.
examples:
  - $type: org.legiblerecords.bundle
    version: 1
    produced_by: { app: track, build: 2026.11.21 }
    files:
      - path: records/control/mfa-company-accounts.json
        sha256: 2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae
        record_type: tech.monorail.controls.control
        record_version: 1

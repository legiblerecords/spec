type: org.legiblerecords.common
version: 1
title: common
description: Definitions every Legible Records type can use.
defs:
  slug: /^[a-z0-9]+(-[a-z0-9]+)*$/ -- A lowercase key made of letters, digits and single hyphens.
  domain:
    description: A publisher, a lowercase domain of two or more labels whose last label isn't all digits, with no scheme, port or path. At most 253 characters.
    type: /^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+([0-9]*[a-z]([a-z0-9-]*[a-z0-9])?|[0-9]+-[a-z0-9-]*[a-z0-9])$/
    json:
      maxLength: 253
  feedId:
    description: A feed's id, <publisher>/<slug>, a domain and a slug. At most 317 characters; a reader also checks that the publisher part is a domain.
    type: /^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+([0-9]*[a-z]([a-z0-9-]*[a-z0-9])?|[0-9]+-[a-z0-9-]*[a-z0-9])\/[a-z0-9]+(-[a-z0-9]+)*$/
    json:
      maxLength: 317
  date: string(date)
  datetime: string(date-time)
  email: string(email)
  refString: '/^[a-z][a-z-]*:[a-z0-9-]+(#[a-z0-9-]+)?$/ -- A reference to another record, kind:key, optionally #part.'
  sha256: /^[0-9a-f]{64}$/
  produced_by:
    description: What wrote the file.
    fields:
      app: string -- The app or tool, such as track or tolerance.monorail.tools.
      build?: string -- Its version or build.
      output?: string -- Which of its outputs, when it has several.
  source:
    description: What the file was built from.
    fields:
      system: string -- The system of record, such as track.
      refs?: string[] -- Identifiers in that system, such as commit ids.
      as_of?: string(date-time)
  attachment:
    description: A file that travels with records in a bundle.
    fields:
      sha256: sha256
      name: string -- The file's name for people, such as access-review-q3.pdf.
      media_type: string -- Such as application/pdf.
  identifier:
    description: Something's id in one system, such as a repository in GitHub or a person in Okta. Matched exactly, both halves together.
    fields:
      system: /^[a-z0-9][a-z0-9.:-]*$/ -- Where the id comes from, in lowercase - github, gitlab, okta, entra, google, slack, serial, outpost:acme.example. Each system names one kind of id (records.md § Pointing at records elsewhere).
      id:
        type: string
        description: The id in that system, as that system writes it - acme/api, 00u1ab2cd3.
        json:
          minLength: 1
  externalRef:
    description: A record that travels elsewhere - in another stream, or from another publisher. Never resolved inside a bundle.
    fields:
      type: /^[a-z0-9-]+(\.[a-z0-9-]+)+$/ -- The record's $type, a type identifier such as tech.monorail.policy.document, not its short name.
      key: slug -- The record's id.
      publisher?: domain -- Whose record it is. Left out only when it is this record's own publisher's and this record travels where that publisher is known - a signed bundle or a feed.
      revision?: integer(1..) -- The record's revision, for types that number their revisions (such as a policy).
      sha256?: sha256 -- Of the record's content line, pinning exactly what it says.
  personMatch:
    description: What a publisher knows about the person a record is about, for a reader to match against the people it holds. Needs emails or identifiers, or both.
    fields:
      emails?: email[] -- Compared case-insensitively.
      identifiers?: identifier[] -- The person's ids in other systems, matched before emails.
      name?: string -- For people to read when resolving a match; never matched on.
